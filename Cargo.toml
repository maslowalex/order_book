[package]
name = "order_book"
authors = ["Oleksandr Maslo"]
version = "0.1.0"
edition = "2024"
description = "A limit order book and matching engine with pluggable allocation policies"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
rust_decimal = "1.42.1"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.9"

[[bench]]
name = "order_book"
harness = false
